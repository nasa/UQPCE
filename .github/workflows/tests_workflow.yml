# Run Tests

name: UQPCE Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.environment }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        environment: [default]
        include:
          - os: ubuntu-latest
            environment: py311
          - os: ubuntu-latest
            environment: py312
          - os: ubuntu-latest
            environment: py313
          - os: ubuntu-latest
            environment: py314

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.39.0
          cache: true
          environments: ${{ matrix.environment }}
          locked: true  # Enforce use of lock file for reproducibility

      # - name: Run linting
      #   run: pixi run -e ${{ matrix.environment }} lint

